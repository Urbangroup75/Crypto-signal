<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Base — Coming soon</title>
  <meta name="description" content="Matrix Base AI. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060d;
      --text: #e8ecff;
      --muted: #8a93b8;
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --pink: #ec4899;
      --line: rgba(139, 92, 246, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Neyron tarmoq foni */
    #network {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Rangli yorug'lik dog'lari */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .glow.a { width: 520px; height: 520px; background: var(--violet); top: -160px; left: -120px; }
    .glow.b { width: 460px; height: 460px; background: var(--cyan); bottom: -180px; right: -120px; animation-delay: -6s; }
    .glow.c { width: 320px; height: 320px; background: var(--pink); top: 40%; left: 55%; opacity: 0.18; animation-delay: -12s; }

    @keyframes drift {
      to { transform: translate(60px, 40px) scale(1.1); }
    }

    /* Mayda to'r chiziqlari */
    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.08);
      backdrop-filter: blur(8px);
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 32px;
      animation: rise 0.9s ease-out both;
    }
    .badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    h1 {
      font-size: clamp(48px, 11vw, 132px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      background: linear-gradient(110deg, var(--cyan) 0%, var(--violet) 45%, var(--pink) 80%, var(--cyan) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 0.9s 0.15s ease-out both, shine 6s linear infinite;
      filter: drop-shadow(0 0 40px rgba(139, 92, 246, 0.35));
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* "AI" daraja ko'rinishida, rangi to'xtovsiz o'zgarib turadi */
    h1 .ai {
      position: relative;
      display: inline-block;
      margin-left: 0.06em;
      font-size: 0.38em;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      letter-spacing: 0;
      vertical-align: super;
      line-height: 1;
      background: linear-gradient(90deg, #22d3ee, #8b5cf6, #ec4899, #f59e0b, #22c55e, #22d3ee);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: ai-flow 4s linear infinite, ai-glow 4s linear infinite, ai-float 3s ease-in-out infinite;
    }

    @keyframes ai-flow {
      to { background-position: 300% center; }
    }

    @keyframes ai-glow {
      0%, 100% { filter: drop-shadow(0 0 10px #22d3ee); }
      25%      { filter: drop-shadow(0 0 14px #8b5cf6); }
      50%      { filter: drop-shadow(0 0 14px #ec4899); }
      75%      { filter: drop-shadow(0 0 12px #f59e0b); }
    }

    @keyframes ai-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-0.12em); }
    }

    .soon {
      margin-top: 48px;
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text);
      animation: rise 0.9s 0.45s ease-out both;
    }
    .soon .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      margin-left: 6px;
      vertical-align: -0.2em;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .bar {
      margin: 22px auto 0;
      width: min(320px, 70vw);
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      animation: rise 0.9s 0.6s ease-out both;
    }
    .bar span {
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
      animation: scan 2.4s ease-in-out infinite;
    }

    @keyframes scan {
      from { transform: translateX(-100%); }
      to { transform: translateX(260%); }
    }

    .sale {
      margin-top: 40px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 700;
      color: var(--text);
      animation: rise 0.9s 0.75s ease-out both;
    }

    .contact {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.06);
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(14px, 2.2vw, 17px);
      color: var(--cyan);
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
      animation: rise 0.9s 0.9s ease-out both;
    }
    .contact:hover,
    .contact:focus-visible {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, 0.12);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
      outline: none;
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      z-index: 1;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: rgba(138, 147, 184, 0.6);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="network" aria-hidden="true"></canvas>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>

  <main>
    <div class="badge"><span class="dot"></span>AI model training</div>
    <h1>Matrix<br>Base<span class="ai">AI</span></h1>
    <div class="soon">Coming soon<span class="cursor"></span></div>
    <div class="bar"><span></span></div>
    <p class="sale">This domain is for sale!!!</p>
    <a class="contact" href="mailto:ops@jetpro.aero">ops@jetpro.aero</a>
  </main>

  <footer>© 2026 Matrix Base</footer>

  <script>
    // Neyron tarmoqqa o'xshash harakatlanuvchi tugunlar
    const canvas = document.getElementById('network');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const LINK_DIST = 140;
    let nodes = [];
    let w, h, dpr;
    const mouse = { x: -9999, y: -9999 };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.round(Math.min(110, (w * h) / 14000));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.6 + 0.6,
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);

      for (const n of nodes) {
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }

      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.hypot(dx, dy);
          if (d < LINK_DIST) {
            ctx.strokeStyle = `rgba(139, 92, 246, ${(1 - d / LINK_DIST) * 0.35})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }

        const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
        if (md < 180) {
          ctx.strokeStyle = `rgba(34, 211, 238, ${(1 - md / 180) * 0.6})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }

        ctx.fillStyle = md < 180 ? '#22d3ee' : 'rgba(200, 210, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

    resize();
    draw();
  </script>
</body>
</html>
